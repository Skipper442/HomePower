name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Check signing secret
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Add repository secret KEYSTORE_PASSWORD (Settings → Secrets and variables → Actions)"
            exit 1
          fi
      - name: Build signed APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle assembleRelease
      - run: |
          cp app/build/outputs/apk/release/app-release.apk HomePower.apk
          echo "{\"versionCode\": ${GITHUB_RUN_NUMBER}, \"versionName\": \"1.${GITHUB_RUN_NUMBER}\"}" > version.json
          cat version.json
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Home Power
          files: |
            HomePower.apk
            version.json
